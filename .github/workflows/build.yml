name: Build 3DS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make BUILD_NUM=${{ github.run_number }} REPO=${{ github.repository }}
      - name: Write version file
        run: echo ${{ github.run_number }} > version.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kebab-klikacz-3ds
          path: |
            kebab-klikacz.3dsx
            kebab-klikacz.smdh
      - name: Publish release (used by the in-game updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnowsza wersja
          make_latest: true
          files: |
            kebab-klikacz.3dsx
            kebab-klikacz.smdh
            version.txt
